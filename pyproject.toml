[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Local Jarvis agent — StreamableHTTP MCP server for PC, browser, and 3D-printer control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
jarvis-agent = "jarvis_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
